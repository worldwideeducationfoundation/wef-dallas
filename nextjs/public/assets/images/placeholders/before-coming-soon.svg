<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- The comparison slider shows this side's half at rest (before on the
       left, after on the right), so the text is centred in that half. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <g fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" transform="translate(320 300)">
    <rect x="0" y="0" width="160" height="124" rx="16"/>
    <circle cx="48" cy="44" r="14"/>
    <path d="M0 104 L52 68 L92 96 L124 76 L160 100"/>
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#475569">Before photo</text>
  <text x="400" y="584" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#475569" opacity="0.8">coming soon</text>
</svg>
